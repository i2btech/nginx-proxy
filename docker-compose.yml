services:

  proxy:
    image: i2btech/nginx-proxy:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NGINX_HTTPS_PORT=8443
      - NGINX_HEALTH_CHECK=/api/healthz
    container_name: proxy
    hostname: proxy
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
      - "8080:8080"
